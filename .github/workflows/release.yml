name: Release firmware

# Push an annotated tag vMAJOR.MINOR.PATCH whose version matches src/version.h.
# The tag message becomes the release notes. Devices install the release
# because ota.json in the latest release names it.
on:
  push:
    tags: ['v*.*.*']

# Only the publish job can write. The build job runs third-party setup code,
# so it holds a read-only token and keeps no credentials in .git/config.
permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: '1.5.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Arduino CLI
        run: |
          mkdir -p "$RUNNER_TEMP/arduino-cli"
          curl -fsSL "https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/arduino-cli" arduino-cli
          echo "$RUNNER_TEMP/arduino-cli" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install -r requirements-dev.txt
          python3 tools/setup.py --firmware
      - name: Compile ESP32-4848S040
        run: build/venv/bin/python tools/build_firmware.py
      - name: Check that the tag names the built version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("build/firmware/ota.json"))["version"])')"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package release files
        working-directory: build/firmware
        run: |
          bundle="VibeMon-Touch-$VERSION-ESP32-4848S040.zip"
          zip -qr "../$bundle" vibemon-esp32.ino.bin vibemon-esp32.ino.bootloader.bin vibemon-esp32.ino.partitions.bin \
            boot_app0.bin manifest.json LICENSE LICENSE-ESP-IDF LICENSE-Arduino OFL-NanumGothic.txt licenses
          (cd .. && sha256sum "$bundle" > "VibeMon-Touch-$VERSION-SHA256SUMS.txt")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          if-no-files-found: error
          path: |
            build/VibeMon-Touch-${{ env.VERSION }}-ESP32-4848S040.zip
            build/VibeMon-Touch-${{ env.VERSION }}-SHA256SUMS.txt
            build/firmware/manifest.json
            build/firmware/vibemon-esp32.ino.bin
            build/firmware/ota.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This job has no checkout, so read the annotated tag message through the API.
          tag="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')"
          test -n "$tag" || { echo "::error::$GITHUB_REF_NAME must be an annotated tag"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "VibeMon Touch $version" \
            --notes-file notes.md --verify-tag \
            "release/VibeMon-Touch-$version-ESP32-4848S040.zip" "release/VibeMon-Touch-$version-SHA256SUMS.txt" \
            release/firmware/manifest.json release/firmware/vibemon-esp32.ino.bin release/firmware/ota.json
