name: Verify firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install pinned test dependencies
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install -r requirements-dev.txt
          python3 tools/setup.py
      - name: Test domain, setup and real LVGL screens
        run: build/venv/bin/python tools/check.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: touchscreen-verification
          path: |
            build/native/screenshots/*.png
            build/native/Testing/Temporary/LastTest.log

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install pinned toolchain
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install -r requirements-dev.txt
          python3 tools/setup.py --install-core
      - name: Compile ESP32-4848S040
        run: build/venv/bin/python tools/build_firmware.py
      - uses: actions/upload-artifact@v7
        with:
          name: vibemon-esp32-4848s040
          if-no-files-found: error
          path: |
            build/firmware/vibemon-esp32.ino.bin
            build/firmware/vibemon-esp32.ino.bootloader.bin
            build/firmware/vibemon-esp32.ino.partitions.bin
            build/firmware/boot_app0.bin
            build/firmware/manifest.json
            build/firmware/LICENSE
            build/firmware/OFL-NanumGothic.txt
