name: Verify firmware

# Runs before every release (called by release.yml) and on demand. Pull requests and pushes do not
# start it; release.yml publishes only after these checks pass.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify; defaults to the triggering commit.
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

# Jobs run on the organization's self-hosted Linux runner, which shares its host with a k3s
# cluster. Every tool runs in the job's container on the rootless Docker daemon, checkouts keep
# no credentials, and all downloads stay under build/ in the job workspace.
jobs:
  native:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Test domain, setup and real LVGL screens
        uses: ./.github/actions/container
        with:
          run: |
            python -m venv build/venv
            build/venv/bin/python -m pip install -r requirements-dev.txt
            python tools/setup.py
            build/venv/bin/python tools/check.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: touchscreen-verification
          path: |
            build/native/screenshots/*.png
            build/native/Testing/Temporary/LastTest.log

  firmware:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Compile ESP32-4848S040
        uses: ./.github/actions/container
        with:
          run: |
            python -m venv build/venv
            build/venv/bin/python -m pip install -r requirements-dev.txt
            python tools/setup.py --firmware
            build/venv/bin/python tools/build_firmware.py
      - uses: actions/upload-artifact@v7
        with:
          name: vibemon-esp32-4848s040
          if-no-files-found: error
          path: |
            build/firmware/vibemon-esp32.ino.bin
            build/firmware/vibemon-esp32.ino.bootloader.bin
            build/firmware/vibemon-esp32.ino.partitions.bin
            build/firmware/boot_app0.bin
            build/firmware/manifest.json
            build/firmware/LICENSE
            build/firmware/LICENSE-ESP-IDF
            build/firmware/LICENSE-Arduino
            build/firmware/OFL-NanumGothic.txt
            build/firmware/licenses/
