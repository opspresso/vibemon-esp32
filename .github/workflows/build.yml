name: Verify firmware

# A pull request check builds the merge result, so main is not built again
# after the merge. A vX.Y.Z tag builds once more in release.yml to publish.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# arduino/setup-arduino-cli@v2 still runs on Node.js 20.
env:
  ARDUINO_CLI_VERSION: '1.5.1'

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Arduino CLI
        run: |
          mkdir -p "$RUNNER_TEMP/arduino-cli"
          curl -fsSL "https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/arduino-cli" arduino-cli
          echo "$RUNNER_TEMP/arduino-cli" >> "$GITHUB_PATH"
      - name: Install pinned test dependencies
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install -r requirements-dev.txt
          python3 tools/setup.py
      - name: Test domain, setup and real LVGL screens
        run: build/venv/bin/python tools/check.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: touchscreen-verification
          path: |
            build/native/screenshots/*.png
            build/native/Testing/Temporary/LastTest.log

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Arduino CLI
        run: |
          mkdir -p "$RUNNER_TEMP/arduino-cli"
          curl -fsSL "https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/arduino-cli" arduino-cli
          echo "$RUNNER_TEMP/arduino-cli" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install -r requirements-dev.txt
          python3 tools/setup.py --firmware
      - name: Compile ESP32-4848S040
        run: build/venv/bin/python tools/build_firmware.py
      - uses: actions/upload-artifact@v7
        with:
          name: vibemon-esp32-4848s040
          if-no-files-found: error
          path: |
            build/firmware/vibemon-esp32.ino.bin
            build/firmware/vibemon-esp32.ino.bootloader.bin
            build/firmware/vibemon-esp32.ino.partitions.bin
            build/firmware/boot_app0.bin
            build/firmware/manifest.json
            build/firmware/LICENSE
            build/firmware/LICENSE-ESP-IDF
            build/firmware/LICENSE-Arduino
            build/firmware/OFL-NanumGothic.txt
            build/firmware/licenses/
