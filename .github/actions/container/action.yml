name: Run in the CI container
description: Build the pinned toolchain image on the runner's rootless Docker daemon and run a command in the workspace.
inputs:
  run:
    description: Bash commands to run in the repository root
    required: true
runs:
  using: composite
  steps:
    - uses: opspresso/agent-platform/.github/actions/service-setup@main
      with:
        install: "false"
        docker: "true"
    - shell: bash
      env:
        COMMAND: ${{ inputs.run }}
      run: |
        # The tag is unique to this job, so cleanup removes only this job's reference.
        image="vibemon-esp32-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
        docker build --quiet --tag "$image" "$GITHUB_ACTION_PATH" >/dev/null
        trap 'docker image rm "$image" >/dev/null' EXIT
        docker run --rm --volume "$GITHUB_WORKSPACE:/work" --workdir /work "$image" bash -euo pipefail -c "$COMMAND"
